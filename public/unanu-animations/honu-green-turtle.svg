<svg xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" height="100%" viewBox="0 0 400 400" width="100%">
<defs>
<radialGradient cx="50%" cy="50%" id="waterBg" r="60%">
<stop offset="0%" stop-color="#1b788a"></stop>
<stop offset="100%" stop-color="#0a2f3f"></stop>
</radialGradient>
</defs>
<style>
    @keyframes turtleGlide {
      0% { transform: translate(0px, 0px) rotate(0deg); }
      25% { transform: translate(12px, -8px) rotate(2deg); }
      50% { transform: translate(0px, -14px) rotate(0deg); }
      75% { transform: translate(-10px, -6px) rotate(-2deg); }
      100% { transform: translate(0px, 0px) rotate(0deg); }
    }
    @keyframes flipperLeft {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(18deg); }
    }
    @keyframes flipperRight {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(-18deg); }
    }
    @keyframes flipperRear {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(10deg); }
    }
    @keyframes bubbleRise {
      0% { transform: translateY(0) scale(0.6); opacity: 0; }
      40% { opacity: 0.8; }
      100% { transform: translateY(-70px) scale(1.3); opacity: 0; }
    }
    .turtle-group { animation: turtleGlide 6s ease-in-out infinite; transform-origin: 200px 200px; }
    .flipper-l { animation: flipperLeft 3.5s ease-in-out infinite; transform-origin: 145px 165px; }
    .flipper-r { animation: flipperRight 3.5s ease-in-out infinite; transform-origin: 255px 165px; }
    .flipper-rl { animation: flipperRear 3s ease-in-out infinite; transform-origin: 160px 255px; }
    .flipper-rr { animation: flipperRear 3s ease-in-out infinite reverse; transform-origin: 240px 255px; }
    .bubble { animation: bubbleRise 3.5s ease-out infinite; }
  </style>
<circle cx="200" cy="200" fill="url(#waterBg)" r="180" stroke="#45b6ad" stroke-width="4"></circle>
<circle cx="200" cy="200" fill="none" r="172" stroke="#0a2f3f" stroke-width="2"></circle>
<!-- Ambient bubbles -->
<circle class="bubble" cx="120" cy="180" fill="#a7f3d0" opacity="0.6" r="6"></circle>
<circle class="bubble" cx="290" cy="220" fill="#a7f3d0" opacity="0.5" r="4" style="animation-delay: 1.5s;"></circle>
<circle class="bubble" cx="190" cy="120" fill="#a7f3d0" opacity="0.7" r="5" style="animation-delay: 0.8s;"></circle>
<!-- TURTLE ANATOMY -->
<g class="turtle-group">
<!-- Rear Flippers -->
<path class="flipper-rl" d="M 160 255 C 135 285 125 310 145 315 C 160 318 175 295 175 265 Z" fill="#2d6a4f" stroke="#52b788" stroke-width="2"></path>
<path class="flipper-rr" d="M 240 255 C 265 285 275 310 255 315 C 240 318 225 295 225 265 Z" fill="#2d6a4f" stroke="#52b788" stroke-width="2"></path>
<!-- Tail -->
<polygon fill="#40916c" points="195,280 205,280 200,305"></polygon>
<!-- Front Left Flipper -->
<g class="flipper-l">
<path d="M 145 165 C 90 150 40 125 55 105 C 75 90 120 125 155 155 Z" fill="#40916c" stroke="#74c69d" stroke-width="2.5"></path>
</g>
<!-- Front Right Flipper -->
<g class="flipper-r">
<path d="M 255 165 C 310 150 360 125 345 105 C 325 90 280 125 245 155 Z" fill="#40916c" stroke="#74c69d" stroke-width="2.5"></path>
</g>
<!-- Head & Neck -->
<ellipse cx="200" cy="115" fill="#52b788" rx="22" ry="32" stroke="#2d6a4f" stroke-width="2.5"></ellipse>
<circle cx="188" cy="102" fill="#1b4332" r="3.5"></circle>
<circle cx="212" cy="102" fill="#1b4332" r="3.5"></circle>
<!-- Carapace (Shell) -->
<ellipse cx="200" cy="210" fill="#1b4332" rx="68" ry="82" stroke="#d5b36a" stroke-width="4"></ellipse>
<!-- Shell Scutes Pattern -->
<!-- Center Scutes -->
<polygon fill="#2d6a4f" points="200,145 220,165 220,195 200,210 180,195 180,165" stroke="#d5b36a" stroke-width="2"></polygon>
<polygon fill="#2d6a4f" points="200,210 222,230 222,260 200,275 178,260 178,230" stroke="#d5b36a" stroke-width="2"></polygon>
<!-- Lateral Scutes -->
<path d="M 180 175 C 150 180 145 210 178 225" fill="#40916c" stroke="#d5b36a" stroke-width="1.8"></path>
<path d="M 220 175 C 250 180 255 210 222 225" fill="#40916c" stroke="#d5b36a" stroke-width="1.8"></path>
<path d="M 178 235 C 148 245 150 270 182 270" fill="#40916c" stroke="#d5b36a" stroke-width="1.8"></path>
<path d="M 222 235 C 252 245 250 270 218 270" fill="#40916c" stroke="#d5b36a" stroke-width="1.8"></path>
</g>
<text fill="#74c69d" font-family="Georgia, serif" font-size="14" font-weight="bold" letter-spacing="3" text-anchor="middle" x="200" y="365">HONU GREEN TURTLE</text>
</svg>
